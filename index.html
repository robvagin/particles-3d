<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particles 3D</title>
<style>
  :root{ --paper:#f6f5f2; --ink:#1a1a1a; --muted:#8b8880; --line:#dcdad4; --panel:#fdfdfc; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
    font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
  #cv{display:block;position:fixed;inset:0;width:100%;height:100%}
  #cv.__scninv{filter:invert(1) hue-rotate(180deg)}
  #boot{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;max-width:420px;
    text-align:center;color:var(--muted);font-size:12px;line-height:1.6;padding:16px;display:none}
  #panel{position:fixed;top:16px;left:16px;width:270px;max-height:calc(100vh - 32px);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    display:flex;flex-direction:column;overflow:hidden;z-index:10}
  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;padding:10px 0;background:none;border:0;font:inherit;color:var(--muted);
    cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
  #tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px var(--ink)}
  #body{overflow-y:auto;padding:12px 14px 16px}
  .tab{display:none}.tab.on{display:block}
  fieldset{border:0;margin:0 0 14px;padding:0}
  legend{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
  .row{display:grid;grid-template-columns:1fr 60px 46px;gap:8px;align-items:center;margin:5px 0}
  .row label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row input[type=range]{width:100%;accent-color:var(--ink);height:2px}
  .row input[type=number]{width:100%;font:10px ui-monospace,monospace;color:var(--muted);
    background:var(--paper);border:1px solid var(--line);border-radius:4px;text-align:right;padding:3px 4px}
  .row input[type=number]:focus{color:var(--ink);outline:none;border-color:var(--ink)}
  .row input[type=number]::-webkit-inner-spin-button{display:none}
  .seg{display:flex;gap:4px;margin:2px 0 10px;flex-wrap:wrap}
  .seg button,.btn{padding:6px 9px;font:inherit;font-size:11px;background:none;
    border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--muted)}
  .seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
  .btn{color:var(--ink);margin:3px 4px 3px 0}
  .btn:hover{border-color:var(--ink)}
  .crow{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:center;margin:4px 0}
  .chip{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
  .tin{font:10px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;
    background:var(--paper);color:var(--ink);padding:4px 6px;width:100%}
  .note{color:var(--muted);font-size:10px;margin:6px 0;line-height:1.5}
  #mpadWrap{margin:2px 0 10px}
  #mpad{width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:block;cursor:crosshair}
  .padcap{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:3px}
  #transport{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;z-index:9;background:var(--panel);
    border:1px solid var(--line);border-radius:99px;padding:6px 12px;box-shadow:0 2px 10px rgba(20,20,25,.06)}
  #transport button{padding:5px 10px;font:inherit;font-size:11px;background:none;border:1px solid transparent;
    border-radius:99px;cursor:pointer;color:var(--muted)}
  #transport button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
  #transport #tPlay{color:var(--ink);border-color:var(--ink)}
  #transport .tlab{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
  #transport input[type=range]{width:58px;accent-color:var(--ink);height:2px}
  #invBtn{position:fixed;right:16px;bottom:16px;z-index:20;width:34px;height:34px;border-radius:99px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);font:14px/1 ui-monospace,monospace;
    cursor:pointer;box-shadow:0 2px 10px rgba(20,20,25,.06)}
  #invBtn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:var(--muted);
    font-size:10px;letter-spacing:.04em;z-index:5;pointer-events:none}
  #fps{position:fixed;top:16px;right:16px;z-index:8;font-size:10px;color:var(--muted)}
  body.noui #panel,body.noui #transport,body.noui #hint,body.noui #invBtn,body.noui #fps{display:none}

:root{--h-bg:#f6f5f2;--h-card:#ecebe6;--h-field:#ffffff;--h-ink:#1a1a1a;--h-ink2:#3d3c39;--h-ink3:#5c5b57;--h-fill:rgba(26,26,26,.07);--h-fill-hover:rgba(26,26,26,.10);--h-fill-strong:rgba(26,26,26,.15);--h-fill-active:rgba(26,26,26,.24);--h-hair:rgba(26,26,26,.10);--h-line:rgba(26,26,26,.14);--h-seg-on:#ffffff;--h-track-s:.02em;--h-ring:oklch(.49 .08 182);--h-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--h-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;--h-display:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --paper:var(--h-bg);--ink:var(--h-ink);--muted:var(--h-ink3);--line:var(--h-hair);--accent:var(--h-ink);--panel:var(--h-bg)}
body.dark{--h-bg:#161615;--h-card:#21211f;--h-field:#2b2b29;--h-ink:#ecebe6;--h-ink2:#cfcec8;--h-ink3:#a6a59f;--h-fill:rgba(255,255,255,.07);--h-fill-hover:rgba(255,255,255,.10);--h-fill-strong:rgba(255,255,255,.16);--h-fill-active:rgba(255,255,255,.26);--h-hair:rgba(255,255,255,.10);--h-line:rgba(255,255,255,.14);--h-seg-on:#3d3d3a;--h-track-s:.025em;--h-ring:oklch(.78 .09 182 / .7);--paper:var(--h-bg);--ink:var(--h-ink);--muted:var(--h-ink3);--line:var(--h-hair);--accent:var(--h-ink);--panel:var(--h-bg)}
html,body{font-family:var(--h-sans);font-size:12.5px;line-height:1.45}
#panel,body.dark #panel{background:var(--h-bg);border:1px solid var(--h-hair);border-radius:6px;color:var(--h-ink);box-shadow:none}
#tabs{gap:2px;margin:10px 12px 2px;padding:3px;border:0;border-radius:6px;background:var(--h-fill)}
#tabs button{padding:6px 0;border-radius:4px;font:500 11.5px var(--h-sans);letter-spacing:var(--h-track-s);text-transform:none;color:var(--h-ink2)}
#tabs button[aria-selected="true"],body.dark #tabs button[aria-selected="true"]{background:var(--h-seg-on);color:var(--h-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
legend{font:600 10.5px var(--h-sans);letter-spacing:.07em;color:var(--h-ink3)}
.row,.selectRow,.colorRow{min-height:28px;margin:4px 0}
.row{grid-template-columns:minmax(0,1fr) 92px 40px}
.row label,.selectRow label,.colorRow label{color:var(--h-ink2);letter-spacing:var(--h-track-s)}
.row input[type=range]{-webkit-appearance:none;appearance:none;height:26px;margin:0;border-radius:4px;cursor:ew-resize;
  background:linear-gradient(90deg,var(--h-fill-strong) var(--p,50%),var(--h-fill) var(--p,50%))}
.row input[type=range]:active{background:linear-gradient(90deg,var(--h-fill-active) var(--p,50%),var(--h-fill) var(--p,50%))}
.row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2px;height:26px;border-radius:1px;background:var(--h-ink)}
.row input[type=range]::-moz-range-thumb{width:2px;height:26px;border:0;border-radius:1px;background:var(--h-ink)}
.row input[type=number]{border:0;background:transparent;font:12px var(--h-mono);color:var(--h-ink2);text-align:right}
.sw,body.dark .sw{border:0;background:var(--h-fill-strong)}
.sw::before{background:var(--h-field)}
.sw:checked,body.dark .sw:checked{border:0;background:var(--h-ink)}
.sw:checked::before{background:var(--h-bg)}
.tin,.sel,.selectRow select{height:26px;border:0;border-radius:4px;background:var(--h-fill);color:var(--h-ink);font:12px var(--h-sans)}
.seg{gap:2px;padding:3px;border-radius:6px;background:var(--h-fill)}
.seg button{border:0;border-radius:4px;background:transparent;color:var(--h-ink2);font:500 11.5px var(--h-sans)}
.seg button[aria-selected=true],.seg button[aria-pressed=true],body.dark .seg button[aria-selected=true],body.dark .seg button[aria-pressed=true]{border:0;background:var(--h-seg-on);color:var(--h-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.beh{gap:2px;padding:3px;border-radius:6px;background:var(--h-fill)}
.beh button{border:0;border-radius:4px;background:transparent;color:var(--h-ink2);font:500 11.5px var(--h-sans)}
.beh button[aria-selected="true"]{border:0;background:var(--h-seg-on);color:var(--h-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#panel>header b{font:600 10.5px var(--h-sans);letter-spacing:.07em;color:var(--h-ink3)}
.btn{border:0;border-radius:4px;background:var(--h-fill);color:var(--h-ink);font:500 12px var(--h-sans)}
.btn:hover{border:0;background:var(--h-fill-hover)}
.btn.acc{background:var(--h-ink);color:var(--h-bg)}
.mpad canvas,body.dark .mpad canvas{border:0;border-radius:6px;background:var(--h-field)}
.colorRow input[type=color]{border:0;border-radius:4px}
#mtrans button,#mtrans .msp,body.dark #mtrans button,body.dark #mtrans .msp,#uitoggle,body.dark #uitoggle{border:1px solid var(--h-hair);background:var(--h-bg);color:var(--h-ink)}
#mtrans button[aria-pressed="true"]{background:var(--h-ink);color:var(--h-bg)}
:focus-visible{outline:2px solid var(--h-ring);outline-offset:1px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="boot"></div>

<div id="panel">
  <div id="tabs">
    <button data-tab="show" aria-selected="true">Show</button>
    <button data-tab="scene">Scene</button>
    <button data-tab="io">Export</button>
  </div>
  <div id="body">
    <div class="tab on" data-tab="show">
      <fieldset><legend>Motion pad</legend>
        <div id="mpadWrap"><canvas id="mpad"></canvas>
          <div class="padcap"><span>slow · soft</span><span>fast · raw</span></div></div>
      </fieldset>
      <fieldset id="gShow"><legend>Timing</legend></fieldset>
      <fieldset><legend>Palette · grayscale</legend>
        <div class="crow"><div class="chip" id="ch0"></div><input class="tin pal" data-i="0"></div>
        <div class="crow"><div class="chip" id="ch1"></div><input class="tin pal" data-i="1"></div>
        <p class="note">Particle ink on paper. Press <b>I</b> or ◑ to invert only the scene.</p>
      </fieldset>
    </div>
    <div class="tab" data-tab="scene">
      <fieldset><legend>Home shape</legend>
        <div class="seg" id="shapeSeg">
          <button data-s="0">Sphere</button><button data-s="1">Ball</button>
          <button data-s="2">Box</button><button data-s="3">Torus</button><button data-s="4">Disc</button>
        </div>
      </fieldset>
      <fieldset id="gScene"><legend>Particles</legend></fieldset>
      <fieldset><legend>Presets</legend>
        <div class="seg" id="presetSeg">
          <button data-p="cloud">Cloud</button><button data-p="swirl">Swirl</button>
          <button data-p="shell">Shell</button><button data-p="ribbon">Ribbon</button>
        </div>
        <div class="row" style="grid-template-columns:1fr auto"><label>Auto-rotate</label>
          <input type="checkbox" id="autoRot"></div>
      </fieldset>
    </div>
    <div class="tab" data-tab="io">
      <fieldset><legend>Media</legend>
        <button class="btn" id="pngBtn">Export PNG</button>
        <button class="btn" id="recBtn">● Rec WebM</button>
      </fieldset>
      <fieldset><legend>Config</legend>
        <button class="btn" id="saveCfg">Save JSON</button>
        <button class="btn" id="loadCfg">Load JSON</button>
        <input type="file" id="loadFile" accept=".json" hidden>
      </fieldset>
      <fieldset><legend>UI</legend><button class="btn" id="hideBtn">Hide UI (H)</button></fieldset>
    </div>
  </div>
</div>

<div id="transport">
  <button id="tPlay">⟲ Replay</button>
  <button id="tLoop" aria-pressed="true">Loop</button>
  <label class="tlab">Hold<input type="range" id="tHold" min="0.5" max="8" step="0.1"></label>
  <label class="tlab">Speed<input type="range" id="tSpeed" min="0.4" max="2" step="0.05" value="1"></label>
</div>
<button id="invBtn" aria-pressed="false" title="Invert scene (I)">◑</button>
<div id="hint">drag orbit · scroll zoom · ⟲ re-assemble · Loop breathe · I invert · H hide UI</div>
<div id="fps"></div>

<script>
const boot = document.getElementById('boot');

const canvas = document.getElementById('cv');

const gl = canvas.getContext('webgl2', {
  antialias: true,
  preserveDrawingBuffer: true,
  alpha: false
});

if (!gl) {
  boot.style.display = 'block';
  boot.innerHTML = 'WebGL2 is not available in this viewer.<br>Open this file in <b>Chrome / Safari / Firefox</b> (not an in-app preview).';
} else {
  try {
    main();
  } catch (e) {
    boot.style.display = 'block';
    boot.innerHTML = 'WebGL error: <span style="opacity:.6">' + (e && e.message || e) + '</span>';
    console.error(e);
  }
}

function main() {
  const clamp01 = v => Math.max(0, Math.min(1, v)), lerp = (a, b, t) => a + (b - a) * t, fract = x => x - Math.floor(x);
  const motionResolve = (x, y) => ({
    speed: lerp(.35, 1.9, clamp01(x)),
    ease: clamp01(y)
  });
  function revealAt(t, dur, hold, mode) {
    const OUT = .9, cyc = dur + hold + OUT + .3;
    if (mode !== 'loop') return clamp01(t / dur);
    const tt = (t % cyc + cyc) % cyc;
    if (tt < dur) return clamp01(tt / dur);
    if (tt < dur + hold) return 1;
    return clamp01(1 - (tt - dur - hold) / OUT);
  }
  const hexRGB = h => {
    h = h.replace('#', '');
    return [ parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255 ];
  };
  function perspective(o, fovy, asp, n, f) {
    const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f);
    o[0] = t / asp;
    o[1] = 0;
    o[2] = 0;
    o[3] = 0;
    o[4] = 0;
    o[5] = t;
    o[6] = 0;
    o[7] = 0;
    o[8] = 0;
    o[9] = 0;
    o[10] = (f + n) * nf;
    o[11] = -1;
    o[12] = 0;
    o[13] = 0;
    o[14] = 2 * f * n * nf;
    o[15] = 0;
    return o;
  }
  function lookAt(o, e, c, up) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
    let zl = 1 / Math.hypot(zx, zy, zz);
    zx *= zl;
    zy *= zl;
    zz *= zl;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    let xl = Math.hypot(xx, xy, xz);
    xl = xl ? 1 / xl : 0;
    xx *= xl;
    xy *= xl;
    xz *= xl;
    let yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx;
    o[1] = yx;
    o[2] = zx;
    o[3] = 0;
    o[4] = xy;
    o[5] = yy;
    o[6] = zy;
    o[7] = 0;
    o[8] = xz;
    o[9] = yz;
    o[10] = zz;
    o[11] = 0;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]);
    o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]);
    o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]);
    o[15] = 1;
    return o;
  }
  const isMobile = matchMedia('(pointer:coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4;
  const MAXCOUNT = isMobile ? 9e4 : 3e5;
  const state = {
    scene: {
      count: isMobile ? 45e3 : 13e4,
      spread: 1,
      size: 1.7,
      flow: .6,
      noise: 1,
      swirl: .45,
      shape: 0
    },
    motion: {
      x: .4,
      y: .6,
      speed: 1
    },
    show: {
      reveal: 1.3,
      hold: 2.4,
      speed: 1
    },
    palette: [ '#1a1a1a', '#f6f5f2' ],
    view: {
      autoRot: 0
    },
    anim: {
      t: 0,
      playing: 1,
      mode: 'loop'
    }
  };
  let needs = true;
  const VS = `#version 300 es\n    precision highp float;\n    in vec3 aPos; in float aSeed; in float aScl;\n    uniform mat4 uProj,uView;\n    uniform float uTime,uFlow,uNoise,uSwirl,uSpread,uSize,uReveal,uDpr;\n    out float vA;\n    void main(){\n      vec3 p=aPos*uSpread; float t=uTime; float ph=aSeed*6.2831;\n      vec3 f=vec3(\n        sin(p.y*1.6*uNoise+t+ph)+cos(p.z*1.1*uNoise-t),\n        sin(p.z*1.6*uNoise+t*1.1)+cos(p.x*1.1*uNoise-t+ph),\n        sin(p.x*1.6*uNoise+t*0.9)+cos(p.y*1.1*uNoise-t));\n      p+=f*(0.16*uFlow);\n      float a=uSwirl*(0.6+0.4*sin(t*0.5))*(0.8-length(p.xz)*0.15);\n      float ca=cos(a),sa=sin(a); p.xz=mat2(ca,-sa,sa,ca)*p.xz;\n      float rv=smoothstep(0.0,1.0,clamp(uReveal*1.15-aSeed*0.15,0.0,1.0));\n      p*=rv; vA=rv;\n      vec4 mv=uView*vec4(p,1.0);\n      gl_Position=uProj*mv;\n      gl_PointSize=uSize*aScl*(4.0/max(0.001,-mv.z))*uDpr*(0.4+0.6*rv);\n    }`;
  const FS = `#version 300 es\n    precision mediump float;\n    in float vA; uniform vec3 uColor; out vec4 o;\n    void main(){ vec2 d=gl_PointCoord-0.5; float m=smoothstep(0.5,0.12,length(d));\n      if(m<=0.001) discard; o=vec4(uColor, m*0.55*vA); }`;
  function sh(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const L = {
    aPos: gl.getAttribLocation(prog, 'aPos'),
    aSeed: gl.getAttribLocation(prog, 'aSeed'),
    aScl: gl.getAttribLocation(prog, 'aScl')
  };
  [ 'uProj', 'uView', 'uTime', 'uFlow', 'uNoise', 'uSwirl', 'uSpread', 'uSize', 'uReveal', 'uDpr', 'uColor' ].forEach(k => L[k] = gl.getUniformLocation(prog, k));
  const proj = new Float32Array(16), view = new Float32Array(16);
  const V = [ 0, 0, 0 ];
  function homePosition(i, shape) {
    const r1 = fract(Math.sin(i * 12.9898) * 43758.5453), r2 = fract(Math.sin(i * 78.233) * 12345.678), r3 = fract(Math.sin(i * 37.719) * 9876.543);
    if (shape === 1) {
      const u = Math.acos(2 * r1 - 1), th = r2 * 6.2831853, rad = Math.cbrt(r3);
      V[0] = Math.sin(u) * Math.cos(th) * rad;
      V[1] = Math.cos(u) * rad;
      V[2] = Math.sin(u) * Math.sin(th) * rad;
    } else if (shape === 2) {
      V[0] = r1 * 2 - 1;
      V[1] = r2 * 2 - 1;
      V[2] = r3 * 2 - 1;
    } else if (shape === 3) {
      const a = r1 * 6.2831853, b = r2 * 6.2831853, tr = .35;
      V[0] = (1 + tr * Math.cos(b)) * Math.cos(a) * .8;
      V[1] = tr * Math.sin(b) * .8;
      V[2] = (1 + tr * Math.cos(b)) * Math.sin(a) * .8;
    } else if (shape === 4) {
      const a = r1 * 6.2831853, rad = Math.sqrt(r2);
      V[0] = Math.cos(a) * rad;
      V[1] = (r3 - .5) * .08;
      V[2] = Math.sin(a) * rad;
    } else {
      const u = Math.acos(2 * r1 - 1), th = r2 * 6.2831853;
      V[0] = Math.sin(u) * Math.cos(th);
      V[1] = Math.cos(u);
      V[2] = Math.sin(u) * Math.sin(th);
    }
  }
  let vao = null, buffers = [], N = 0;
  function buildParticles() {
    N = Math.min(MAXCOUNT, Math.round(state.scene.count));
    const pos = new Float32Array(N * 3), seed = new Float32Array(N), scl = new Float32Array(N), shp = Math.round(state.scene.shape);
    for (let i = 0; i < N; i++) {
      homePosition(i, shp);
      pos[i * 3] = V[0];
      pos[i * 3 + 1] = V[1];
      pos[i * 3 + 2] = V[2];
      seed[i] = fract(Math.sin(i * 3.17) * 91.7);
      scl[i] = .6 + fract(Math.sin(i * 5.11) * 57.3) * .8;
    }
    if (vao) gl.deleteVertexArray(vao);
    buffers.forEach(b => gl.deleteBuffer(b));
    buffers = [];
    vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const put = (loc, data, size) => {
      const b = gl.createBuffer();
      buffers.push(b);
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    };
    put(L.aPos, pos, 3);
    put(L.aSeed, seed, 1);
    put(L.aScl, scl, 1);
    gl.bindVertexArray(null);
    needs = true;
  }
  let az = .6, el = .22, r = 6.2, tAz = az, tEl = el, tR = r, drag = false, px = 0, py = 0;
  canvas.addEventListener('pointerdown', e => {
    drag = true;
    px = e.clientX;
    py = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  addEventListener('pointermove', e => {
    if (!drag) return;
    tAz -= (e.clientX - px) * .005;
    tEl += (e.clientY - py) * .005;
    tEl = Math.max(-1.45, Math.min(1.45, tEl));
    px = e.clientX;
    py = e.clientY;
    needs = true;
  });
  addEventListener('pointerup', () => drag = false);
  canvas.addEventListener('wheel', e => {
    tR *= 1 + Math.sign(e.deltaY) * .08;
    tR = Math.max(2.6, Math.min(18, tR));
    needs = true;
    e.preventDefault();
  }, {
    passive: false
  });
  let DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * DPR);
    canvas.height = Math.floor(innerHeight * DPR);
    needs = true;
  }
  addEventListener('resize', resize);
  const paper = () => hexRGB(state.palette[1]), ink = () => hexRGB(state.palette[0]);
  function draw() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    const bg = paper();
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(prog);
    az += (tAz - az) * .12;
    el += (tEl - el) * .12;
    r += (tR - r) * .12;
    let ay = az;
    if (state.view.autoRot) ay += state.anim.t * .15;
    const eye = [ r * Math.cos(el) * Math.sin(ay), r * Math.sin(el), r * Math.cos(el) * Math.cos(ay) ];
    perspective(proj, 50 * Math.PI / 180, canvas.width / canvas.height, .1, 100);
    lookAt(view, eye, [ 0, 0, 0 ], [ 0, 1, 0 ]);
    const m = motionResolve(state.motion.x, state.motion.y);
    gl.uniformMatrix4fv(L.uProj, false, proj);
    gl.uniformMatrix4fv(L.uView, false, view);
    gl.uniform1f(L.uTime, state.anim.t);
    gl.uniform1f(L.uFlow, state.scene.flow * (.5 + m.ease));
    gl.uniform1f(L.uNoise, state.scene.noise);
    gl.uniform1f(L.uSwirl, state.scene.swirl);
    gl.uniform1f(L.uSpread, state.scene.spread);
    gl.uniform1f(L.uSize, state.scene.size);
    gl.uniform1f(L.uReveal, revealAt(state.anim.t, state.show.reveal, state.show.hold, state.anim.mode));
    gl.uniform1f(L.uDpr, DPR);
    const c = ink();
    gl.uniform3f(L.uColor, c[0], c[1], c[2]);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.bindVertexArray(null);
  }
  let last = performance.now(), fpsT = 0, fpsN = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1e3, .05);
    last = now;
    const m = motionResolve(state.motion.x, state.motion.y);
    if (state.anim.playing) {
      state.anim.t += dt * state.show.speed * m.speed;
      needs = true;
    }
    if (state.view.autoRot) needs = true;
    if (needs) {
      draw();
      needs = state.anim.playing || state.view.autoRot || Math.abs(tAz - az) + Math.abs(tEl - el) + Math.abs(tR - r) > .001;
    }
    fpsT += dt;
    fpsN++;
    if (fpsT >= .5) {
      document.getElementById('fps').textContent = Math.round(fpsN / fpsT) + ' fps';
      fpsT = 0;
      fpsN = 0;
    }
    requestAnimationFrame(frame);
  }
  const $ = s => document.querySelector(s);
  const getPath = k => k.split('.').reduce((o, p) => o[p], state);
  const setPath = (k, v) => {
    const ps = k.split('.'), l = ps.pop();
    ps.reduce((o, p) => o[p], state)[l] = v;
  };
  const defs = {
    gShow: [ [ 'show.reveal', 'Assemble', .4, 4, .1 ], [ 'show.hold', 'Hold (loop)', .5, 8, .1 ] ],
    gScene: [ [ 'scene.count', 'Count', 2e3, MAXCOUNT, 1e3 ], [ 'scene.spread', 'Spread', .4, 2.2, .01 ], [ 'scene.size', 'Point size', .4, 5, .05 ], [ 'scene.flow', 'Flow', 0, 2, .01 ], [ 'scene.noise', 'Turbulence', .2, 3, .01 ], [ 'scene.swirl', 'Swirl', 0, 1.5, .01 ] ]
  };
  function buildSliders(id, list) {
    const el = $('#' + id);
    for (const [key, name, min, max, step] of list) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label>${name}</label><input type="range" min="${min}" max="${max}" step="${step}"><input type="number" min="${min}" max="${max}" step="${step}">`;
      const rr = row.querySelector('input[type=range]'), nn = row.querySelector('input[type=number]');
      const fmt = x => +(+x).toFixed(step < 1 ? 2 : 0);
      rr.value = getPath(key);
      nn.value = fmt(getPath(key));
      rr.dataset.key = key;
      rr.addEventListener('input', () => {
        setPath(key, +rr.value);
        nn.value = fmt(rr.value);
        onParam(key);
      });
      nn.addEventListener('change', () => {
        const x = parseFloat(nn.value);
        if (isFinite(x)) {
          setPath(key, x);
          rr.value = x;
          onParam(key);
        }
      });
      el.appendChild(row);
    }
  }
  function onParam(key) {
    if (key === 'scene.count') buildParticles();
    needs = true;
  }
  buildSliders('gShow', defs.gShow);
  buildSliders('gScene', defs.gScene);
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === b.dataset.tab));
  });
  function syncSeg(id, val, attr) {
    document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', b.dataset[attr] == String(val)));
  }
  $('#shapeSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    state.scene.shape = +b.dataset.s;
    syncSeg('shapeSeg', state.scene.shape, 's');
    buildParticles();
  });
  const PRESETS = {
    cloud: {
      shape: 1,
      spread: 1.1,
      size: 1.7,
      flow: .5,
      noise: 1,
      swirl: .35
    },
    swirl: {
      shape: 0,
      spread: 1,
      size: 1.5,
      flow: .9,
      noise: 1.4,
      swirl: 1.1
    },
    shell: {
      shape: 0,
      spread: 1.2,
      size: 1.9,
      flow: .3,
      noise: .7,
      swirl: .2
    },
    ribbon: {
      shape: 3,
      spread: 1,
      size: 1.6,
      flow: .8,
      noise: 1.2,
      swirl: .6
    }
  };
  $('#presetSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    Object.assign(state.scene, PRESETS[b.dataset.p]);
    syncSeg('shapeSeg', state.scene.shape, 's');
    refreshSliders();
    buildParticles();
    state.anim.t = 0;
  });
  $('#autoRot').addEventListener('change', e => {
    state.view.autoRot = e.target.checked ? 1 : 0;
    needs = true;
  });
  function refreshSliders() {
    document.querySelectorAll('.row input[type=range]').forEach(rr => {
      const k = rr.dataset.key;
      if (!k) return;
      rr.value = getPath(k);
      rr.nextElementSibling.value = +(+getPath(k)).toFixed(2);
    });
  }
  function syncPalette() {
    document.querySelectorAll('.pal').forEach(inp => {
      const i = +inp.dataset.i;
      inp.value = state.palette[i];
      $('#ch' + i).style.background = state.palette[i];
    });
  }
  document.querySelectorAll('.pal').forEach(inp => inp.addEventListener('change', () => {
    const i = +inp.dataset.i, v = inp.value.trim();
    if (/^#?[0-9a-fA-F]{6}$/.test(v)) {
      state.palette[i] = v.startsWith('#') ? v : '#' + v;
      syncPalette();
      needs = true;
    }
  }));
  const mpad = $('#mpad'), mctx = mpad.getContext('2d');
  function drawPad() {
    const rc = mpad.getBoundingClientRect();
    const s = Math.max(60, Math.min(rc.width || 220, 240));
    mpad.width = s * 2;
    mpad.height = s * 2;
    mctx.setTransform(2, 0, 0, 2, 0, 0);
    mctx.clearRect(0, 0, s, s);
    mctx.strokeStyle = '#dcdad4';
    mctx.lineWidth = 1;
    mctx.strokeRect(.5, .5, s - 1, s - 1);
    const pxx = state.motion.x * s, pyy = (1 - state.motion.y) * s;
    mctx.beginPath();
    mctx.moveTo(pxx, 0);
    mctx.lineTo(pxx, s);
    mctx.moveTo(0, pyy);
    mctx.lineTo(s, pyy);
    mctx.stroke();
    mctx.fillStyle = '#1a1a1a';
    mctx.beginPath();
    mctx.arc(pxx, pyy, 5, 0, 6.2831);
    mctx.fill();
  }
  function padSet(e) {
    const rc = mpad.getBoundingClientRect();
    state.motion.x = clamp01((e.clientX - rc.left) / rc.width);
    state.motion.y = clamp01(1 - (e.clientY - rc.top) / rc.height);
    drawPad();
    needs = true;
  }
  let padDrag = false;
  mpad.addEventListener('pointerdown', e => {
    padDrag = true;
    padSet(e);
    mpad.setPointerCapture(e.pointerId);
  });
  mpad.addEventListener('pointermove', e => {
    if (padDrag) padSet(e);
  });
  addEventListener('pointerup', () => padDrag = false);
  function setLoop(on) {
    state.anim.mode = on ? 'loop' : 'once';
    if (on) state.anim.t = 0;
    state.anim.playing = 1;
    $('#tLoop').setAttribute('aria-pressed', on);
    needs = true;
  }
  $('#tPlay').addEventListener('click', () => {
    state.anim.t = 0;
    state.anim.playing = 1;
    needs = true;
  });
  $('#tLoop').addEventListener('click', () => setLoop(state.anim.mode !== 'loop'));
  $('#tHold').addEventListener('input', e => state.show.hold = +e.target.value);
  $('#tSpeed').addEventListener('input', e => state.show.speed = +e.target.value);
  $('#tHold').value = state.show.hold;
  function invert() {
    const on = canvas.classList.toggle('__scninv');
    $('#invBtn').setAttribute('aria-pressed', on);
  }
  $('#invBtn').addEventListener('click', invert);
  addEventListener('keydown', e => {
    const t = e.target.tagName;
    if ([ 'INPUT', 'TEXTAREA', 'SELECT' ].includes(t)) return;
    if (e.key.toLowerCase() === 'i') invert();
    if (e.key.toLowerCase() === 'h') document.body.classList.toggle('noui');
  });
  $('#pngBtn').addEventListener('click', () => {
    draw();
    const a = document.createElement('a');
    a.download = 'particles.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
  let recorder = null;
  $('#recBtn').addEventListener('click', () => {
    if (recorder) return;
    const st = canvas.captureStream(60);
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
    recorder = new MediaRecorder(st, {
      mimeType: mime,
      videoBitsPerSecond: 12e6
    });
    const ch = [];
    recorder.ondataavailable = e => ch.push(e.data);
    recorder.onstop = () => {
      const a = document.createElement('a');
      a.download = 'particles.webm';
      a.href = URL.createObjectURL(new Blob(ch, {
        type: 'video/webm'
      }));
      a.click();
      recorder = null;
      $('#recBtn').textContent = '● Rec WebM';
    };
    state.anim.t = 0;
    recorder.start();
    $('#recBtn').textContent = '■ Stop';
    const cyc = (state.show.reveal + state.show.hold + 1.2) / Math.max(.1, state.show.speed);
    setTimeout(() => {
      if (recorder && recorder.state === 'recording') recorder.stop();
    }, cyc * 1e3 + 200);
  });
  $('#saveCfg').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = 'particles-3d.json';
    a.href = URL.createObjectURL(new Blob([ JSON.stringify({
      version: 1,
      scene: state.scene,
      motion: state.motion,
      show: state.show,
      palette: state.palette,
      view: state.view
    }, null, 1) ], {
      type: 'application/json'
    }));
    a.click();
  });
  $('#loadCfg').addEventListener('click', () => $('#loadFile').click());
  $('#loadFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    f.text().then(t => {
      const c = JSON.parse(t);
      if (c.scene) Object.assign(state.scene, c.scene);
      if (c.motion) Object.assign(state.motion, c.motion);
      if (c.show) Object.assign(state.show, c.show);
      if (c.palette) state.palette = c.palette;
      if (c.view) Object.assign(state.view, c.view);
      syncSeg('shapeSeg', state.scene.shape, 's');
      refreshSliders();
      syncPalette();
      drawPad();
      buildParticles();
      $('#tHold').value = state.show.hold;
      $('#tSpeed').value = state.show.speed;
      $('#autoRot').checked = !!state.view.autoRot;
    });
  });
  $('#hideBtn').addEventListener('click', () => document.body.classList.toggle('noui'));
  resize();
  syncPalette();
  syncSeg('shapeSeg', state.scene.shape, 's');
  buildParticles();
  drawPad();
  new ResizeObserver(drawPad).observe(mpad);
  requestAnimationFrame(frame);
}
</script>
<script>(function(){function u(r){var a=+r.min||0,b=+r.max||100,v=+r.value;r.style.setProperty('--p',((v-a)/((b-a)||1)*100)+'%')}function all(){document.querySelectorAll('input[type=range]').forEach(u)}document.addEventListener('input',function(e){if(e.target&&e.target.type==='range')u(e.target)});setInterval(all,250);all()})();</script>
